spring.application.name=api-spring
server.port=8081


# PostgreSQL
# Lê a variável de ambiente; caso não exista, usa o valor padrão.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:bauzil123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# update: cria/altera as tabelas conforme as entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger
# http://localhost:8081/docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method